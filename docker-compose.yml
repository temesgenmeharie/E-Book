services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebook_web
    restart: unless-stopped
    ports:
      - "9300:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: http://localhost:9300
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebook_user}:${POSTGRES_PASSWORD:-ebook_pass_secure}@postgres:5432/${POSTGRES_DB:-ebook_marketplace}?schema=public
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_USE_SSL: "false"
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_secure}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${APP_SECRET:-4f8b2d1c9e3a7f5b8d2e1c9a7f3b5d8e2c1a9f7b5d3e1c9a7f5b3d1e9c7a5b3d}
      SESSION_COOKIE_NAME: ebook_session
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ebook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebook_pass_secure}
      POSTGRES_DB: ${POSTGRES_DB:-ebook_marketplace}
    ports:
      - "9432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebook_user} -d ${POSTGRES_DB:-ebook_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ebook_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_secure}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ebook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: ebook_adminer
    restart: unless-stopped
    ports:
      - "9400:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
