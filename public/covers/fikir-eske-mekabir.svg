<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="imperialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="400" height="560" fill="url(#imperialGrad)"/>
  <rect x="0" y="0" width="22" height="560" fill="#000000" opacity="0.45"/>

  <!-- Ornate Border -->
  <rect x="30" y="30" width="340" height="500" fill="none" stroke="url(#amberGlow)" stroke-width="2" rx="8"/>
  <rect x="38" y="38" width="324" height="484" fill="none" stroke="url(#amberGlow)" stroke-width="0.75" stroke-dasharray="4,2" rx="6"/>

  <!-- Badge -->
  <rect x="125" y="60" width="150" height="24" rx="12" fill="#5b21b6" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="76" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">AMHARIC LITERATURE</text>

  <!-- Titles -->
  <text x="200" y="170" fill="url(#amberGlow)" font-family="Georgia, serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="1">ፍቅር እስከ</text>
  <text x="200" y="225" fill="url(#amberGlow)" font-family="Georgia, serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="1">መቃብር</text>
  
  <text x="200" y="265" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">FIKIR ESKE MEKABIR</text>
  <text x="200" y="285" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1">LOVE UNTO THE CRYPT</text>

  <!-- Traditional Cross & Rose Graphic -->
  <g transform="translate(200, 360)">
    <circle r="42" fill="none" stroke="url(#amberGlow)" stroke-width="1.5"/>
    <path d="M0,-30 L0,30 M-20,0 L20,0" stroke="url(#amberGlow)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#d97706"/>
    <circle cx="-20" cy="0" r="4" fill="#f59e0b"/>
    <circle cx="20" cy="0" r="4" fill="#f59e0b"/>
    <circle cx="0" cy="-30" r="4" fill="#f59e0b"/>
    <circle cx="0" cy="30" r="4" fill="#f59e0b"/>
  </g>

  <!-- Author -->
  <line x1="80" y1="440" x2="320" y2="440" stroke="url(#amberGlow)" stroke-width="1" opacity="0.7"/>
  <text x="200" y="470" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ሀዲስ አለማየሁ</text>
  <text x="200" y="492" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2">HADDIS ALEMAYEHU</text>
</svg>

