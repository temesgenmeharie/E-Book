<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Book Cover Background -->
  <rect width="400" height="560" fill="url(#bgGrad)"/>
  
  <!-- Subtle Spine Shadow -->
  <rect x="0" y="0" width="22" height="560" fill="#000000" opacity="0.4"/>
  <line x1="22" y1="0" x2="22" y2="560" stroke="#fef08a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Ornate Border -->
  <rect x="35" y="30" width="330" height="500" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.75" rx="6"/>
  <rect x="42" y="37" width="316" height="486" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4" rx="4"/>

  <!-- Header Category Badge -->
  <rect x="130" y="60" width="140" height="26" rx="13" fill="#991b1b" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="77" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">ETHIOPIAN CLASSIC</text>

  <!-- Title & Subtitle -->
  <text x="200" y="190" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="2">ኦሮማይ</text>
  <text x="200" y="235" fill="#fef08a" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="4">OROMAY</text>
  <text x="200" y="265" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1">THE HISTORIC LITERARY MASTERPIECE</text>

  <!-- Decorative Center Emblem -->
  <g transform="translate(200, 340)">
    <circle r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
    <circle r="38" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.9"/>
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle r="6" fill="#f59e0b"/>
  </g>

  <!-- Author Name -->
  <line x1="100" y1="430" x2="300" y2="430" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="460" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1">በዓሉ ግርማ</text>
  <text x="200" y="482" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">BAALU GIRMA</text>
</svg>

